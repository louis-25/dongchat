# 로컬 개발용 MySQL — 집/회사 어느 머신에서든 동일하게 재현됩니다.
# 실행:  docker compose up -d
# 중지:  docker compose down        (데이터 유지)
# 초기화: docker compose down -v     (데이터 삭제 후 깨끗하게 다시)
services:
  mysql:
    image: mysql:8.4
    container_name: dongchat-mysql
    restart: unless-stopped
    # 호스트 3307 -> 컨테이너 3306. 머신에 이미 MySQL(3306)이 있어도 충돌 없음.
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: dongchat
      MYSQL_DATABASE: dongchat
      MYSQL_USER: dongchat
      MYSQL_PASSWORD: dongchat
    volumes:
      - dongchat-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdongchat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dongchat-mysql-data:
